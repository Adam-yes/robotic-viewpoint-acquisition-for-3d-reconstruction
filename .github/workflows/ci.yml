name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the packages that don't require CUDA / Open3D for CI
          pip install \
            numpy scipy pyyaml trimesh \
            pytest pytest-cov flake8 \
            matplotlib pandas

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --ignore=E203,W503,E501 \
            --exclude=src/capture/capture_images.py

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_pipeline.py \
            -k "not test_center_mesh and not test_convert_mesh and not test_coverage_tracker"
          # Note: full tests require Open3D/trimesh installed in the conda envs.
          # The CI runs a subset that has no heavy dependencies.

      - name: Run config loading test
        run: |
          python -m pytest tests/test_pipeline.py::test_config_loading \
                           tests/test_pipeline.py::test_visualization_import \
                           tests/test_pipeline.py::test_visualization_print_summary \
                           tests/test_pipeline.py::test_proximity_reward \
            -v --tb=short

      - name: Check test coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/test_pipeline.py::test_config_loading \
                           tests/test_pipeline.py::test_visualization_import \
                           tests/test_pipeline.py::test_visualization_print_summary \
                           tests/test_pipeline.py::test_proximity_reward \
            --cov=src --cov-report=term-missing --cov-fail-under=70

  validate-config:
    name: Validate pipeline_config.yaml
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pyyaml

      - name: Parse and validate config
        run: |
          python - <<'EOF'
          import yaml, sys
          with open('config/pipeline_config.yaml') as f:
              cfg = yaml.safe_load(f)
          required = ['capture', 'reconstruction', 'vggt', 'preprocessing',
                      'ransac', 'icp', 'adaptive', 'registration', 'rl']
          missing = [k for k in required if k not in cfg]
          if missing:
              print(f'ERROR: missing config sections: {missing}', file=sys.stderr)
              sys.exit(1)
          print('Config validation passed.')
          EOF
