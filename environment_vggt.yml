name: vggt
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8
  - pytorch::pytorch=2.1
  - pytorch::torchvision=0.16
  - conda-forge::numpy>=1.24,<2.0
  - conda-forge::scipy>=1.10
  - conda-forge::pillow>=10.0
  - conda-forge::pyyaml>=6.0
  - conda-forge::tqdm>=4.66
  - conda-forge::matplotlib>=3.8
  - conda-forge::pandas>=2.0
  - conda-forge::jupyter
  - conda-forge::pytest>=7.4
  - conda-forge::flake8
  - pip:
    - open3d>=0.17
    - trimesh>=3.23
    - huggingface-hub>=0.20
    - pycolmap>=0.4
    - vggt @ git+https://github.com/facebookresearch/vggt.git

variables:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
